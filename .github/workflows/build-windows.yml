name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Full commit SHA of the reviewed desktop source'
        required: true
        type: string
      version:
        description: 'Expected desktop version, for example 1.2.1'
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    env:
      EXPECTED_VERSION: ${{ inputs.version }}
      SOURCE_REF: ${{ inputs.source_ref }}
    steps:
      - name: Preserve repository line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.1'
          cache: npm
      - name: Verify source and version
        shell: pwsh
        run: |
          if ($env:SOURCE_REF -notmatch '^[a-f0-9]{40}$') { throw 'Use a full commit SHA' }
          if ($env:EXPECTED_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Use a semantic release version' }
          if ((git rev-parse HEAD) -ne $env:SOURCE_REF) { throw 'Source revision mismatch' }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($version -ne $env:EXPECTED_VERSION) { throw 'Desktop version mismatch' }
      - run: npm ci
      - run: npm run version:check
      - run: npm test
      - run: npm run desktop:build -- --target x86_64-pc-windows-msvc --bundles nsis --ci
      # Tauri CLI first synchronizes platform-specific Cargo features with the config.
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib -- --test-threads=1
      - name: Collect installer and build receipt
        shell: pwsh
        run: |
          $files = @(Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe)
          if ($files.Count -ne 1) { throw 'Expected one NSIS installer' }
          New-Item -ItemType Directory -Path release-assets | Out-Null
          $name = "Xinwei_$($env:EXPECTED_VERSION)_windows-x64-setup.exe"
          Copy-Item $files[0].FullName "release-assets/$name"
          $hash = (Get-FileHash "release-assets/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content release-assets/SHA256SUMS-windows -Encoding utf8NoBOM
          $receipt = @{
            version = $env:EXPECTED_VERSION
            sourceRevision = $env:SOURCE_REF
            platform = 'windows-x64'
            artifact = $name
            sha256 = $hash
            signature = 'unsigned'
            nativeInteractiveAcceptance = 'not-run'
            run = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          }
          $receipt | ConvertTo-Json | Set-Content release-assets/build-windows.json -Encoding utf8NoBOM
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xinwei-windows-x64
          path: release-assets/
          if-no-files-found: error
          retention-days: 14
