name: Desktop checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            runner: macos-15
            target: aarch64-apple-darwin
          - name: Windows (x64)
            runner: windows-2022
            target: x86_64-pc-windows-msvc
    env:
      RUSTUP_TOOLCHAIN: '1.98.0'
    steps:
      - name: Preserve repository line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify native Apple Silicon runner
        if: runner.os == 'macOS'
        shell: bash
        run: test "$(uname -m)" = arm64
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.1'
          cache: npm
      - name: Install shared Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --no-self-update
      - name: Install native target
        run: rustup target add ${{ matrix.target }} --toolchain 1.98.0
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: desktop-${{ runner.os }}-${{ matrix.target }}-rust-1.98.0-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml', 'src-tauri/tauri*.conf.json') }}
          restore-keys: |
            desktop-${{ runner.os }}-${{ matrix.target }}-rust-1.98.0-
      - run: npm ci
      - run: npm run version:check
      - run: npm test
      # The CLI prepares per-platform features before direct Cargo commands.
      # Debug, no-bundle checks avoid signing, installer creation and publishing.
      - name: Build native desktop and type-check frontend
        run: npm run desktop:build -- --debug --no-bundle --ci --target ${{ matrix.target }}
      - name: Test native Rust library
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --target ${{ matrix.target }} --lib -- --test-threads=1
